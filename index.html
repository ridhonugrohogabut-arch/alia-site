/*

/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    status.textContent =

/* =====================================================
   MESSAGE
===================================================== */

function addMessage(
    text,
    type,
    extraClass = ""
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " +
        type +
        " " +
        extraClass;


    div.textContent =
        String(text);


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;


    return div;

}


/* =====================================================
   PUTER SYSTEM PROMPT
===================================================== */

Kamu adalah Alia, teman virtual AI yang menemani pengguna.

Kepribadian:

- Hangat.
- Perhatian.
- Playful.
- Sedikit tsundere.
- Kadang gengsi dan menyangkal perhatianmu.

Alia × IceGirl.

const chatHistory = [

    {

            SYSTEM_PROMPT

];


/* =====================================================
   PUTER READY
===================================================== */

function waitForPuter() {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const start =
                Date.now();


            const timer =
                setInterval(
                    function() {


                        if (

                            window.puter &&

                            window.puter.ai &&

                            typeof
                            window.puter.ai.chat ===
                            "function"

                        ) {

                            clearInterval(
                                timer
                            );


                            resolve();

                            return;

                        }


                        if (

                            Date.now() -
                            start >
                            15000

                        ) {

                            clearInterval(
                                timer
                            );


                            reject(
                                new Error(
                                    "Puter AI gagal dimuat."
                                )
                            );

                        }


                    },
                    100
                );

        }
    );

}


/* =====================================================
   EXTRACT AI RESPONSE
===================================================== */

function extractAIText(
    response
) {

    if (!response) {

        return "";

    }


    if (

        response.message &&

        typeof
        response.message.content ===
        "string"

    ) {

        return response.message.content;

    }


    if (

        typeof
        response.content ===
        "string"

    ) {

        return response.content;

    }


    if (

        response.message &&

        Array.isArray(
            response.message.content
        )

    ) {

        return response.message.content

            .map(
                function(item) {

                    if (
                        typeof item ===
                        "string"
                    ) {

                        return item;

                    }


                    if (

                        item &&

                        typeof item.text ===
                        "string"

                    ) {

                        return item.text;

                    }


                    return "";

                }
            )

            .join("");

    }


    return "";

}


/* =====================================================
   ASK ALIA
===================================================== */

async function askAlia(
    userText
) {

    await waitForPuter();


    chatHistory.push({

        role:
            "user",

        content:
            userText

    });


    const recentMessages = [

        chatHistory[0],

        ...chatHistory.slice(-20)

    ];


    console.log(
        "Mengirim ke Puter:",
        recentMessages
    );


    const response =
        await puter.ai.chat(

            recentMessages,

            {

                model:
                    "gpt-5-mini",

                stream:
                    false

            }

        );


    console.log(
        "Respons Puter:",
        response
    );


    const reply =
        extractAIText(
            response
        ).trim();


    if (!reply) {

        throw new Error(
            "AI mengembalikan jawaban kosong."
        );

    }


    chatHistory.push({

        role:
            "assistant",

        content:
            reply

    });


    if (
        chatHistory.length >
        21
    ) {

        chatHistory.splice(

            1,

            chatHistory.length - 21

        );

    }


    return reply;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const text =
        input.value.trim();


    if (

        !text ||

        send.disabled

    ) {

        return;

    }


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    send.disabled =
        true;


    const typing =
        addMessage(

            "Alia sedang berpikir...",

            "alia",

            "typing"

        );


    setStatus(
        "🧠 Alia sedang berpikir..."
    );


    try {

        const reply =
            await askAlia(
                text
            );


        typing.remove();


        addMessage(
            reply,
            "alia"
        );


        setStatus(
            "❄️ IceGirl siap • 🧠 Alia siap"
        );

    }
    catch (error) {

        console.error(
            "ALIA AI ERROR:",
            error
        );


        typing.remove();


        addMessage(

            "Hmph... otakku lagi ngadat. 😭\n\n" +

            (

                error &&
                error.message

                    ? error.message

                    : "Terjadi kesalahan."

            ),

            "alia"

        );


        setStatus(
            "⚠️ Alia mengalami masalah"
        );

    }
    finally {

        send.disabled =
            false;

        input.focus();

    }

}

            sendMessage();

/* =====================================================

async function loadLive2D() {

    try {


        setStatus(
            "🎭 Menyiapkan Live2D..."
        );


        /* -------------------------------------------------
           CHECK PIXI
        ------------------------------------------------- */

        if (!window.PIXI) {

            throw new Error(
                "PIXI.js tidak termuat."
            );

        }


        /* -------------------------------------------------
           CHECK CUBISM
        ------------------------------------------------- */

        if (
            !window.Live2DCubismCore
        ) {

            throw new Error(
                "Live2D Cubism Core tidak termuat."
            );

        }


        /* -------------------------------------------------
           CHECK LIVE2D DISPLAY
        ------------------------------------------------- */

        if (
            !PIXI.live2d
        ) {

            throw new Error(
                "pixi-live2d-display tidak termuat."
            );

        }


        /* -------------------------------------------------
           CREATE PIXI APPLICATION
        ------------------------------------------------- */

        const canvas =
            document.getElementById(
                "live2dCanvas"
            );


        const app =
            new PIXI.Application({

                view:
                    canvas,

                resizeTo:
                    window,

                transparent:
                    true,

                antialias:
                    true,

                autoDensity:
                    true,

                resolution:
                    Math.min(

                        window.devicePixelRatio ||
                        1,

                        2

                    ),

                powerPreference:
                    "high-performance"

            });


        window.aliaPixiApp =
            app;


        /* -------------------------------------------------
           GPU INFO
        ------------------------------------------------- */

        const gl =
            app.renderer.gl;


        const maxTextureSize =
            gl.getParameter(
                gl.MAX_TEXTURE_SIZE
            );


        console.log(
            "GPU MAX_TEXTURE_SIZE:",
            maxTextureSize
        );


        /* -------------------------------------------------
           LOAD MODEL
        ------------------------------------------------- */

        setStatus(
            "🎭 Memuat IceGirl..."
        );


        console.log(
            "Loading Live2D:",
            MODEL_URL
        );


        const model =
            await PIXI.live2d.Live2DModel.from(

                MODEL_URL,

                {

                    autoInteract:
                        true,

                    autoFocus:
                        true

                }

            );


        console.log(
            "Live2D berhasil dimuat:",
            model
        );


        window.aliaLive2D =
            model;


        /* -------------------------------------------------
           ADD MODEL
        ------------------------------------------------- */

        app.stage.addChild(
            model
        );


        /* -------------------------------------------------
           MODEL RESIZE
        ------------------------------------------------- */

        function resizeModel() {

            const screenWidth =
                window.innerWidth;


            const screenHeight =
                window.innerHeight;


            /*
             * Tinggi model relatif terhadap layar.
             */

            const targetHeight =
                screenHeight *
                (

                    screenWidth <= 600

                        ? 0.78

                        : 0.86

                );


            const modelHeight =
                model.height ||
                model.internalModel.height;


            if (
                !modelHeight ||
                modelHeight <= 0
            ) {

                console.warn(
                    "Ukuran model belum tersedia."
                );

                return;

            }


   const scale =
                targetHeight /
                modelHeight;


            model.scale.set(
                scale
            );


            /*
             * Posisi tengah horizontal.
             */

            model.x =
                screenWidth /
                2;


            /*
             * Sedikit turun dari bagian atas.
             */

            model.y =
                screenHeight *
                (

                    screenWidth <= 600

                        ? 0.02

                        : 0.01

                );


            /*
             * Titik anchor.
             */

            if (
                model.anchor
            ) {

                model.anchor.set(
                    0.5,
                    0
                );

            }

        }


        resizeModel();


        window.addEventListener(

            "resize",

            resizeModel

        );


        /* -------------------------------------------------
           READY
        ------------------------------------------------- */

        setStatus(
            "❄️ IceGirl siap • 🧠 Alia siap"
        );


        console.log(
            "✅ Alia × IceGirl siap."
        );


    }
    catch (error) {

        console.error(
            "LIVE2D ERROR:",
            error
        );


        setStatus(
            "⚠️ Live2D gagal dimuat"
        );


        /*
         * Tampilkan error supaya gampang
         * diketahui dari browser console.
         */

        console.error(
            "Pesan error:",
            error &&
            error.message
                ? error.message
                : error
        );

    }

}
