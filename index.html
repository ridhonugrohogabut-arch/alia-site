/* =====================================================
   RESIZE TEXTURE
   8192 → 4096
===================================================== */

async function resizeTexture(
    url
) {

    console.log(
        "Loading original texture..."
    );


    /*
     * Download PNG.
     */

    const response =
        await fetch(
            url
        );


    if (
        !response.ok
    ) {

        throw new Error(

            "Texture error: HTTP " +
            response.status

        );

    }


    /*
     * Blob.
     */

    const blob =
        await response.blob();


    /*
     * Decode PNG.
     */

    const bitmap =
        await createImageBitmap(
            blob
        );


    console.log(

        "Original texture:",

        bitmap.width,

        "x",

        bitmap.height

    );


    /*
     * Target.
     */

    const size =
        4096;


    /*
     * Canvas.
     */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        size;


    canvas.height =
        size;


    /*
     * Context.
     */

    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha:
                    true
            }
        );


    if (!ctx) {

        bitmap.close();


        throw new Error(
            "Canvas 2D tidak tersedia."
        );

    }


    /*
     * Pastikan transparan.
     */

    ctx.clearRect(

        0,
        0,
        size,
        size

    );


    ctx.globalCompositeOperation =
        "source-over";


    /*
     * Resize:
     *
     * 8192 × 8192
     *       ↓
     * 4096 × 4096
     */

    ctx.drawImage(

        bitmap,

        0,
        0,
        bitmap.width,
        bitmap.height,

        0,
        0,
        size,
        size

    );


    /*
     * Bitmap tidak diperlukan lagi.
     */

    bitmap.close();


    console.log(
        "Texture resized → 4096 × 4096"
    );


    /*
     * CanvasResource.
     */

    const resource =
        new PIXI.resources.CanvasResource(
            canvas
        );


    /*
     * BaseTexture.
     */

    const baseTexture =
        new PIXI.BaseTexture(
            resource
        );


    baseTexture.setSize(

        size,
        size

    );


    baseTexture.update();


    /*
     * Texture baru.
     */

    const texture =
        new PIXI.Texture(
            baseTexture
        );


    console.log(
        "New Pixi texture:",
        texture
    );


    return texture;

}

        (
