/* =====================================================
   LIVE2D CONFIG
===================================================== */

const BASE_URL =
    "./live2D/live2d/";

    BASE_URL +
    "IceGirl.model3.json";


/* =====================================================
   DOM
===================================================== */

const status =
    document.getElementById(
        "status"
    );

const messages =
    document.getElementById(
        "messages"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );


/* =====================================================
   CLOUDFLARE TTS
===================================================== */

const TTS_WORKER_URL =
    "https://alia-tts.ridhonugrohogabut.workers.dev";


let currentAudio = null;


async function speakAlia(text) {

    try {

        console.log(
            "🎙️ Meminta suara Alia..."
        );

        const response =
            await fetch(
                TTS_WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            text: text
                        })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "TTS HTTP ERROR:",
                response.status,
                errorText
            );

            return;
        }


        const audioBlob =
            await response.blob();


        const audioURL =
            URL.createObjectURL(
                audioBlob
            );


        if (currentAudio) {

            try {
                currentAudio.pause();
            }
            catch (e) {}

        }


        const audio =
            new Audio(
                audioURL
            );


        currentAudio =
            audio;


        audio.onended =
            function() {

                URL.revokeObjectURL(
                    audioURL
                );

                if (
                    currentAudio ===
                    audio
                ) {

                    currentAudio =
                        null;

                }

            };


        audio.onerror =
            function(error) {

                console.error(
                    "Audio playback error:",
                    error
                );

                URL.revokeObjectURL(
                    audioURL
                );

            };


        await audio.play();


        console.log(
            "🔊 Alia sedang berbicara."
        );


    }
    catch (error) {

        console.error(
            "ALIA TTS ERROR:",
            error
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    status.textContent =
        text;

}


/* =====================================================
   MESSAGE
===================================================== */

function addMessage(
    text,
    type,
    extraClass = ""
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " +
        type +
        " " +
        extraClass;

    div.textContent =
        String(text);

    messages.appendChild(
        div
    );

    messages.scrollTop =
        messages.scrollHeight;

    return div;

}


/* =====================================================
   PUTER SYSTEM PROMPT
===================================================== */

- Perhatian.

Kamu sedang berbicara dengan pengguna melalui website
Alia × IceGirl.

   CHAT HISTORY
===================================================== */

const chatHistory = [

    {
        role:
            "system",

        content:
            SYSTEM_PROMPT
    }

];


/* =====================================================
   PUTER READY
===================================================== */

function waitForPuter() {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const start =
                Date.now();


            const timer =
                setInterval(
                    function() {

                        if (

                            window.puter &&

                            window.puter.ai &&

                            typeof
                            window.puter.ai.chat ===
                            "function"

                        ) {

                            clearInterval(
                                timer
                            );

                            resolve();

                            return;
                        }


                        if (

                            Date.now() -
                            start >
                            15000

                        ) {

                            clearInterval(
                                timer
                            );

                            reject(
                                new Error(
                                    "Puter AI gagal dimuat."
                                )
                            );

                        }

                    },
                    100
                );

        }
    );

}


/* =====================================================
   EXTRACT AI RESPONSE
===================================================== */

function extractAIText(
    response
) {

    if (!response) {

        return "";

    }


    if (

        response.message &&

        typeof
        response.message.content ===
        "string"

    ) {

        return response.message.content;

    }


    if (

        typeof
        response.content ===
        "string"

    ) {

        return response.content;

    }


    if (

        response.message &&

        Array.isArray(
            response.message.content
        )

    ) {

        return response.message.content

            .map(
                function(item) {

                    if (
                        typeof item ===
                        "string"
                    ) {

                        return item;

                    }


                    if (

                        item &&

                        typeof item.text ===
                        "string"

                    ) {

                        return item.text;

                    }


                    return "";

                }
            )

            .join("");

    }


    return "";

}


/* =====================================================
   ASK ALIA
===================================================== */

async function askAlia(
    userText
) {

    await waitForPuter();


    chatHistory.push({

        role:
            "user",

        content:
            userText

    });


    const recentMessages = [

        chatHistory[0],

        ...chatHistory.slice(-20)

    ];


    const response =
        await puter.ai.chat(
            recentMessages,
            {

                model:
                    "gpt-5-mini",

                stream:
                    false

            }
        );


    console.log(
        "Puter response:",
        response
    );


    const reply =
        extractAIText(
            response
        ).trim();


    if (!reply) {

        throw new Error(
            "AI mengembalikan jawaban kosong."
        );

    }


    chatHistory.push({

        role:
            "assistant",

        content:
            reply

    });


    if (
        chatHistory.length >
        21
    ) {

        chatHistory.splice(
            1,
            chatHistory.length -
            21
        );

    }


    return reply;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const text =
        input.value.trim();


    if (

        !text ||

        send.disabled

    ) {

        return;

    }


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    send.disabled =
        true;


    const typing =
        addMessage(
            "Alia sedang berpikir...",
            "alia",
            "typing"
        );


    setStatus(
        "🧠 Alia sedang berpikir..."
    );


    try {

        const reply =
            await askAlia(
                text
            );


        typing.remove();


        addMessage(
            reply,
            "alia"
        );


        /*
         * ================================================
         * TTS
         * ================================================
         */

        speakAlia(
            reply
        );


        setStatus(
            "❄️ IceGirl siap • 🧠 Alia siap"
        );

    }
    catch (error) {

        console.error(
            "ALIA AI ERROR:",
            error
        );


        typing.remove();


        addMessage(

            "Hmph... otakku lagi ngadat. 😭\n\n" +

            (

                error &&

                error.message

                    ? error.message

                    : "Terjadi kesalahan."

            ),

            "alia"

        );


        setStatus(
            "⚠️ Alia mengalami masalah"
        );

    }
    finally {

        send.disabled =
            false;

        input.focus();

    }

}


/* =====================================================
   CHAT EVENTS
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);
